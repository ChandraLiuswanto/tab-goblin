pid /tmp/tabgoblin-nginx.pid;
error_log /dev/stderr warn;

events {}

http {
  access_log off;
  client_body_temp_path /tmp/tabgoblin-nginx/client;
  proxy_temp_path /tmp/tabgoblin-nginx/proxy;
  fastcgi_temp_path /tmp/tabgoblin-nginx/fastcgi;
  scgi_temp_path /tmp/tabgoblin-nginx/scgi;
  uwsgi_temp_path /tmp/tabgoblin-nginx/uwsgi;

  server {
    # This is exposed only through Podman's host-loopback publish rule.
    listen 0.0.0.0:9222;

    # Chromium is private on 127.0.0.1:9223. Rewrite its discovery URL to the
    # caller's loopback Host header, which includes Podman's ephemeral host port.
    location = /json/version {
      proxy_pass http://127.0.0.1:9223/json/version;
      proxy_http_version 1.1;
      proxy_set_header Accept-Encoding "";
      sub_filter_once off;
      sub_filter_types application/json;
      sub_filter "ws://127.0.0.1:9223" "ws://$http_host";
    }

    # Includes the DevTools WebSocket paths; Nginx tunnels Upgrade connections.
    location / {
      proxy_pass http://127.0.0.1:9223;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }
  }
}
